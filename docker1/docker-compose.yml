version: '3.8'

services:
  app1-clientes:
    build: ./app1-clientes
    ports:
      - "5001:5001"
    networks:
      - barberia-net
    restart: unless-stopped

  app2-citas:
    build: ./app2-citas
    ports:
      - "5002:5002"
    networks:
      - barberia-net
    restart: unless-stopped

  app3-servicios:
    build: ./app3-servicios
    ports:
      - "5003:5003"
    networks:
      - barberia-net
    restart: unless-stopped

networks:
  barberia-net:
    external: true