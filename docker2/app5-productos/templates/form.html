{% extends 'base.html' %}
{% block contenido %}
<h2>{{ 'Editar' if producto else 'Nuevo' }} Producto</h2>
<form class="form-card" method="post">
  <label>Nombre</label>
  <input type="text" name="nombre" value="{{ producto.nombre if producto else '' }}" required>
  <label>Stock</label>
  <input type="number" name="stock" min="0" value="{{ producto.stock if producto else '0' }}">
  <label>Precio</label>
  <input type="number" name="precio" step="0.01" value="{{ producto.precio if producto else '' }}">
  <div class="form-actions">
    <button type="submit">Guardar</button>
    <a href="/" class="btn">Cancelar</a>
  </div>
</form>
{% endblock %}
