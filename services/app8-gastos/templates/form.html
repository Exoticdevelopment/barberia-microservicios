{% extends "base.html" %}
{% block title %}{{ 'Editar' if item else 'Nuevo' }} Gasto{% endblock %}
{% block content %}
<h2>{{ 'Editar Gasto' if item else 'Nuevo Gasto' }}</h2>
<form method="post" class="form-card">
  <label>Concepto</label>
  <input type="text" name="concepto" value="{{ item.concepto if item else '' }}" required>
  <label>Monto</label>
  <input type="number" step="0.01" name="monto" value="{{ item.monto if item else '' }}" required>
  <label>Fecha</label>
  <input type="date" name="fecha" value="{{ item.fecha if item else '' }}">
  <div class="form-actions">
    <button type="submit">Guardar</button>
    <a href="{{ url_for('index') }}" class="btn">Cancelar</a>
  </div>
</form>
{% endblock %}
